version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: truthai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/truthai
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=replace-me-with-a-secure-random-string
      - FRONTEND_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  db-data:
